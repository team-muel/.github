name: reusable-node-quality

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '24'
      package-manager:
        description: Optional setup-node cache package manager (npm, yarn, or pnpm); leave empty to disable caching
        required: false
        type: string
        default: ''
      cache-dependency-path:
        description: Optional dependency lockfile path used for cache keys
        required: false
        type: string
        default: ''
      install-command:
        description: Dependency installation command
        required: false
        type: string
        default: npm ci
      test-command:
        description: Test command
        required: false
        type: string
        default: npm test
      build-command:
        description: Build command; leave empty to skip
        required: false
        type: string
        default: npm run build --if-present

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Test
        run: ${{ inputs.test-command }}
      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
