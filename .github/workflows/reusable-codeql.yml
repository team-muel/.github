name: reusable-codeql

on:
  workflow_call:
    inputs:
      languages-json:
        description: JSON array of CodeQL languages, for example ["javascript-typescript"] or ["python"]
        required: false
        type: string
        default: '["javascript-typescript"]'
      build-mode:
        description: CodeQL build mode. Use none for interpreted/JavaScript repositories, autobuild for compiled languages CodeQL can build on its own, or manual together with build-command.
        required: false
        type: string
        default: none
      build-command:
        description: Shell command(s) run between CodeQL init and analyze. Required when build-mode is manual; ignored otherwise.
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages-json) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manual build inputs
        if: ${{ inputs.build-mode == 'manual' && inputs.build-command == '' }}
        run: |
          echo "::error::build-mode is manual but build-command is empty. Supply build-command or use build-mode none/autobuild."
          exit 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
      - name: Build (manual mode)
        if: ${{ inputs.build-mode == 'manual' }}
        shell: bash
        run: ${{ inputs.build-command }}
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
