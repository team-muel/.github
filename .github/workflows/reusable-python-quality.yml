name: reusable-python-quality

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: '3.12'
      requirements-file:
        description: Requirements file; leave empty to skip
        required: false
        type: string
        default: requirements-dev.txt
      test-command:
        description: Test command
        required: false
        type: string
        default: python -m pytest -q
      build-command:
        description: Build command; leave empty to skip
        required: false
        type: string
        default: python -m build

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install dependencies
        if: ${{ inputs.requirements-file != '' }}
        run: python -m pip install --requirement "${{ inputs.requirements-file }}"
      - name: Test
        run: ${{ inputs.test-command }}
      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
