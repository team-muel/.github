name: reusable-python-quality

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: '3.12'
      requirements-file:
        description: Requirements file; leave empty to skip dependency installation and pip caching
        required: false
        type: string
        default: requirements-dev.txt
      test-command:
        description: Test command
        required: false
        type: string
        default: python -m pytest -q
      build-command:
        description: Optional build command; leave empty for non-package repositories
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python with pip cache
        if: ${{ inputs.requirements-file != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}
      - name: Set up Python without cache
        if: ${{ inputs.requirements-file == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        if: ${{ inputs.requirements-file != '' }}
        run: python -m pip install --requirement "${{ inputs.requirements-file }}"
      - name: Test
        run: ${{ inputs.test-command }}
      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
